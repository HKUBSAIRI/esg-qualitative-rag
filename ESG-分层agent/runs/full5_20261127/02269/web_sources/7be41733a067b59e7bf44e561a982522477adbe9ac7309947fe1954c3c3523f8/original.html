	<script type="text/javascript">
	    $(function(){
	       var type= $("#type").val();
           if(type==2 ){//行政执法文书
                $("#tab1").attr("header","行政执法文书");
                $("#tab2").attr("header","法律法规");
                initIsIE();
                initVue();
                IEPlaceholder();
                $("#tab1Jsp").load('./writJsp');
                $("#tab2Jsp").load('./lawJsp');
            }else{// 执行法律法规 
                $("#tab1").attr("header","法律法规");
                $("#tab2").attr("header","行政执法文书");
               initIsIE();
                initVue();
                IEPlaceholder();
                $("#tab1Jsp").load('./lawJsp');
                $("#tab2Jsp").load('./writJsp');
            }
	    })
